[book]
title = "Railroad Network"
description = "Plain-language documentation for Railroad Network: a mutual-credit economy, identity, and governance stack for self-organizing communities that keeps working when the internet does not."
authors = ["Railroad Network contributors"]
language = "en"
src = "src"

[build]
# A page listed in SUMMARY.md must exist; planned-but-unwritten pages are
# draft entries ("[Title]()") so the sidebar shows the plan without 404s.
create-missing = false

[output.html]
site-url = "/"
git-repository-url = "https://github.com/railroad-network/railroad-network.github.io"
edit-url-template = "https://github.com/railroad-network/railroad-network.github.io/edit/main/{path}"
additional-css = ["theme/custom.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1
